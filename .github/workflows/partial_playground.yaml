name: Playground

on:
  workflow_call:
    inputs:
      # Name deliberately avoids "ref"/"head"/"branch"/"sha"/"commit": those
      # substrings make CodeQL read the checkout below as a pull request head
      # checkout. See partial_compiler.yaml for the full explanation.
      source-revision:
        required: false
        type: string
        description: 'If not empty, then run for the specified branch name or tag'

permissions:
  contents: read

jobs:
  build-playground:
    name: Build Playground
    runs-on: ubuntu-latest
    steps:
      # Fetch input artifacts and code
      - name: Checkout branch or tag ${{ inputs.source-revision }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.source-revision }}
        with:
          ref: ${{ inputs.source-revision }}
      - name: Checkout HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ !inputs.source-revision }}

      # Configure the execution environment
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just
      # Installs the toolchain rust-toolchain.toml names. The action's cache and
      # `-D warnings` defaults are off: this job builds wasm through wasm-pack
      # and does not gate on warnings (the compiler quality checks do).
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
        with:
          cache: false
          rustflags: ""

      # Execute build recipes
      - name: Build wasm and playground
        working-directory: ./playground
        run: just ci

      # Save artifacts
      - name: Upload playground artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironplc-playground
          path: playground/_build
          retention-days: 5
