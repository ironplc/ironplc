name: IronPLC Compiler
on:
  workflow_call:
    inputs:
      # Named `source-revision` rather than `commit-ref`, and the name matters.
      # CodeQL's actions/untrusted-checkout heuristic treats any
      # `actions/checkout` whose `ref:` comes from an expression whose *name*
      # contains "ref", "head", "branch", "sha", or "commit" as a checkout of a
      # pull request head -- regardless of where the value actually comes from.
      # Every job below checks out this input, so a name like `commit-ref`
      # raises one medium "Checkout of untrusted code" alert per job, and adding
      # a job adds a new alert that fails the CodeQL check on the pull request.
      # Keep this name (and the names of any expressions that carry it) free of
      # those substrings.
      source-revision:
        required: false
        type: string
        description: 'If not empty, then run for the specified tag'
      gh-release-tag:
        required: false
        type: string
        default: ""
        description: 'The Github Release tag to publish to (empty value disables publishing)'
      version:
        required: false
        type: string
        default: "0.0.0"
        description: "The version number, such as 1.2.3"

# Build jobs never write to the repository or a release. They only produce
# build artifacts (via actions/upload-artifact, which needs no contents:write).
# The consolidated upload-release-artifacts job attaches them to the release.
# See specs/adrs/0032-ci-gating-and-secret-scoping.md.
permissions:
  contents: read

jobs:
  compiler-sbom:
    name: Compiler SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./compiler
    steps:
      - name: Checkout branch or tag ${{ inputs.source-revision }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.source-revision }}
        with:
          ref: ${{ inputs.source-revision }}
      - name: Checkout HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ !inputs.source-revision }}

      - uses: taiki-e/install-action@01159adff8f38113be7211e869405f6f6abf02d7 # just
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      # rust-cache caches ~/.cargo/bin, so the cargo-cyclonedx install below is
      # a near no-op on a warm cache. Every compiler-package leg waits on this
      # job, so its duration is a serial prefix of all the installer builds.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "compiler -> target"
          key: sbom-ubuntu-latest
      - name: Install SBOM tools
        run: just setup-sbom

      - name: Generate SBOM
        run: just sbom ${{ inputs.version }}

      - name: Upload SBOM as build artifact (for matrix consumption)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironplc-compiler-sbom
          path: |
            compiler/bom.cdx.json
            compiler/bom.cdx.json.sha256
          if-no-files-found: error

  # Quality gate: debug build, coverage (which runs all tests), lint, and
  # duplicate-code checks via `just ci`. Runs in parallel with compiler-package
  # (neither job depends on the other) so the coverage build and the release
  # build no longer happen serially.
  #
  # Coverage/lint/dupes are host-independent, and `just ci` never uses the
  # release `rust_target`. Cross-platform test execution is provided instead by
  # the compiler-test job, so this gate runs on Linux only.
  compiler-quality:
    name: Compiler Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./compiler

    steps:
      # Checkout the repository/fetch input artifacts
      - name: Checkout branch or tag ${{ inputs.source-revision }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.source-revision }}
        with:
          ref: ${{ inputs.source-revision  }}
      - name: Checkout HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ !inputs.source-revision }}

      # Configure the execution environment. Only the tools `just ci` needs;
      # no cross-compile target, SBOM, or NSIS.
      - uses: taiki-e/install-action@01159adff8f38113be7211e869405f6f6abf02d7 # just
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "compiler -> target"
          key: quality-ubuntu-latest
      - uses: taiki-e/install-action@03e268b84870ac3cfa58a44d9b504511b732a857 # cargo-llvm-cov
      - name: Install cargo-dupes
        run: cargo install cargo-dupes

      # Compile, run coverage (all tests, 85% gate), lint, and dupe checks.
      - name: Run quality checks
        run: just ci

  # Cross-platform test gate: the full test suite on each unique host OS.
  # `cargo test` always builds and runs for the host, never for the release
  # cross-compile target, so running it inside the 5-leg compiler-package
  # matrix executed the identical host suite twice on Windows and twice on
  # macOS -- and serialized every installer build behind a test run. This job
  # runs the same suite on the same 3 unique hosts, in parallel with the
  # package builds. The reusable workflow still fails if any job fails, so
  # release uploads remain gated on these tests passing.
  compiler-test:
    name: Compiler Tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./compiler
    strategy:
      fail-fast: true
      matrix:
        os: [windows-2025, ubuntu-latest, macos-latest]

    steps:
      # Checkout the repository/fetch input artifacts
      - name: Checkout branch or tag ${{ inputs.source-revision }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.source-revision }}
        with:
          ref: ${{ inputs.source-revision }}
      - name: Checkout HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ !inputs.source-revision }}

      # Configure the execution environment. Only what `just test` needs: no
      # cross-compile target, SBOM, or NSIS.
      - uses: taiki-e/install-action@01159adff8f38113be7211e869405f6f6abf02d7 # just
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "compiler -> target"
          key: test-${{ matrix.os }}

      - name: Run tests
        run: just test

  compiler-package:
    name: Build Compiler and Associated Installers
    needs: [compiler-sbom]
    runs-on:  ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./compiler
    strategy:
      fail-fast: true
      # `verify` marks legs whose rust_target the build host can execute, so
      # the packaged release binaries can be smoke-tested in place. Only the
      # aarch64 Windows cross-build cannot run on its x86_64 host (the x86_64
      # macOS build runs on the arm64 host via Rosetta 2); that leg is covered
      # by the post-release smoke tests instead.
      matrix:
        include:
          - os: windows-2025
            artifact: ironplcc-x86_64-windows.exe
            rust_target: x86_64-pc-windows-msvc
            verify: true
          - os: windows-2025
            artifact: ironplcc-aarch64-windows.exe
            rust_target: aarch64-pc-windows-msvc
            verify: false
          - os: ubuntu-latest
            artifact: ironplcc-x86_64-linux-musl.tar.gz
            rust_target: x86_64-unknown-linux-musl
            verify: true
          - os: macos-latest
            artifact: ironplcc-x86_64-macos.tar.gz
            rust_target: x86_64-apple-darwin
            verify: true
          - os: macos-latest
            artifact: ironplcc-aarch64-macos.tar.gz
            rust_target: aarch64-apple-darwin
            verify: true

    steps:
      # Checkout the repository/fetch input artifacts
      - name: Checkout branch or tag ${{ inputs.source-revision }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.source-revision }}
        with:
          ref: ${{ inputs.source-revision  }}
      - name: Checkout HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ !inputs.source-revision }}

      # Configure the execution environment. Only the tools `just package`
      # needs; lint/coverage tooling lives in compiler-quality.
      - uses: taiki-e/install-action@01159adff8f38113be7211e869405f6f6abf02d7 # just
      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
        with:
          target: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "compiler -> target"
          # Include target triple in cache key for cross-compilation
          key: ${{ matrix.rust_target }}
      - name: Cache NSIS
        if: ${{ matrix.os == 'windows-2025' }}
        id: cache-nsis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: 'C:\Program Files (x86)\NSIS'
          # Bump the suffix (v1 -> v2, etc.) to force a fresh NSIS install
          key: ${{ runner.os }}-nsis-v1
      - name: Install NSIS
        if: ${{ matrix.os == 'windows-2025' }}
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\Bin\makensis.exe")) {
            choco install nsis --no-progress
          } else {
            Write-Host "NSIS restored from cache"
          }
        
      # Fetch the workspace SBOM produced by compiler-sbom so the
      # package step can embed it inside the tarball / NSIS installer.
      - name: Download SBOM for embedding
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ironplc-compiler-sbom
          path: compiler/

      # Execute build recipe. This is the release build only; the debug /
      # coverage / lint build runs in parallel in compiler-quality, and the
      # cross-platform test suite runs in parallel in compiler-test.
      - name: Create installer package
        run: just package ${{ inputs.version }} ${{ matrix.artifact }} ${{ matrix.rust_target }}

      # Run the exact release binaries that were packed into the installer:
      # compile and execute the bundled-library fixtures on the shipped
      # compiler + VM. This tests the bytes we ship -- something the previous
      # in-job `just test` (a debug-profile host build) never did.
      - name: Verify packaged release binaries
        if: ${{ matrix.verify }}
        run: just verify-package ${{ matrix.rust_target }}

      # Save output artifacts. Uploaded unconditionally (not gated on
      # gh-release-tag) so a deployment dry run still produces them and the
      # upload-release-artifacts job can be exercised end to end without
      # publishing. Only the consolidated job's final attach step is gated on
      # a real (non-dry) release.
      - name: Upload Compiler Installer to Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: compiler/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 5

      - name: Upload Compiler Installer SHA256 to Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}.sha256
          path: compiler/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 5
