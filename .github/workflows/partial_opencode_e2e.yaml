name: OpenCode Integration E2E
on:
  workflow_call:
    inputs:
      compiler-version:
        required: true
        type: string
        description: 'The version number to test with (without the "v" prefix). Empty string uses the latest release.'
      model:
        required: false
        type: string
        default: "qwen2.5:1.5b"
        description: 'Ollama model used for the real-agent end-to-end test'
  # Allow running manually against any branch from the Actions tab. The bulk of
  # the test lives in the justfile, so this exercises branch changes directly.
  workflow_dispatch:
    inputs:
      compiler-version:
        required: false
        type: string
        default: ""
        description: 'The version number to test with (without the "v" prefix). Empty string uses the latest release.'
      model:
        required: false
        type: string
        default: "qwen2.5:1.5b"
        description: 'Ollama model used for the real-agent end-to-end test'

permissions:
  contents: read

jobs:
  opencode-e2e:
    name: OpenCode Integration E2E Job
    runs-on: ubuntu-latest
    steps:
      # Fetch input artifacts and code
      - name: Checkout HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Configure the execution environment
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up Ollama
        uses: ai-action/setup-ollama@4d24ba3341d7b8e6ed2f80aa4ee53be6ee8e29fc # v2.1.19

      # Install the published compiler and run the OpenCode end-to-end test.
      - name: OpenCode end-to-end test
        run: just opencode-e2e "${{ inputs.compiler-version }}" "${{ inputs.model }}"
