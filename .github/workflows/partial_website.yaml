name: Website
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
        description: 'If set true, then publish the website'
      # Name deliberately avoids "ref"/"head"/"branch"/"sha"/"commit": those
      # substrings make CodeQL read the checkout below as a pull request head
      # checkout. See partial_compiler.yaml for the full explanation.
      source-revision:
        required: false
        type: string
        description: 'If not empty, then run for the specified branch name or tag'

# No workflow-level permissions block: this reusable workflow inherits the
# GITHUB_TOKEN permissions granted by each caller's job. A reusable workflow
# cannot request more than the caller grants, so declaring contents: write here
# would force every caller (including build-only ones) to grant write. Instead,
# the publish caller (deployment.yaml's publish-website job) opts up to
# contents: write, while build-only callers (integration.yaml, update.yaml)
# inherit the default contents: read and skip the publish step (publish: false).
# See specs/adrs/0032-ci-gating-and-secret-scoping.md.

jobs:
  docs:
    name: Documentation Job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      # Fetch input artifacts and code
      - name: Checkout branch or tag ${{ inputs.source-revision }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.source-revision }}
        with:
          ref: ${{ inputs.source-revision  }}
      - name: Checkout HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.source-revision }}

      # Configure the execution environment
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just
      - name: Set up Python 3.x
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: './docs/package-lock.json'

      # Execute build recipes
      - name: Build docs
        run: just ci

      # Save artifacts
      - name: Publish by Copying Build to gh-pages branch
        if: ${{ inputs.publish }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action doesn't seem to respect the working directory
          publish_dir: docs/_build
          force_orphan: false
          allow_empty_commit: false
