[package]
name = "ironplc-lowering"
description = "Lowers an analyzed IronPLC library to the target-neutral lowered program that backends consume."
version = "0.251.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[badges]
maintenance = { status = "experimental" }

[dependencies]
ironplc-analyzer = { path = "../analyzer", version = "0.251.0" }
# For the default capacity of a string declared without one, which the
# analyzer's types leave unstated.
ironplc-container = { path = "../container", version = "0.251.0" }
ironplc-dsl = { path = "../dsl", version = "0.251.0" }
ironplc-ir = { path = "../ir", version = "0.251.0" }

[build-dependencies]
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

[dev-dependencies]
ironplc-parser = { path = "../parser", version = "0.251.0" }
spec_test_macro = { path = "../spec_test_macro" }
time = "0.3.47"

[lints]
workspace = true
