[package]
name = "ironplc-wasm-codegen"
description = "WebAssembly target of IronPLC: memory layout, WebAssembly emission, instrumentation and validation"
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
ironplc-wasm-ir = { path = "../wasm-ir", version = "0.247.0" }
ironplc-wasm-symbols = { path = "../wasm-symbols", version = "0.247.0" }
wasm-encoder = "0.259"
wasmparser = "0.259"

[dev-dependencies]
ironplc-wasm-runner = { path = "../wasm-runner" }

[lints]
workspace = true
