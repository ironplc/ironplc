[package]
name = "ironplc-vm"
description = "Bytecode virtual machine for IronPLC"
version = "0.249.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Re-exports the shared container fixtures alongside the VM-side helpers.
# `container` owns the fixtures, so the feature has to be turned on there too.
test-support = ["ironplc-container/test-support"]
profiling = []

[dependencies]
ironplc-container = { path = "../container", version = "0.249.0" }
# Verus specifications and the `verus!` macro. Pinned with `=` to the version
# the pinned Verus release was cut with: `vstd` must match the `verus` binary
# that verifies it, and `cargo update` must not move one without the other.
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false }

[dev-dependencies]
ironplc-vm = { path = ".", features = ["test-support"] }
# `#[cfg(test)]` code in `src/` uses the container fixtures directly, so the
# feature must be on for this crate's own test build and not only for
# downstream crates that enable `ironplc-vm/test-support`.
ironplc-container = { path = "../container", version = "0.249.0", features = [
  "test-support",
] }
proptest = "1"
rstest = "0.27"
spec_test_macro = { path = "../spec_test_macro" }

[build-dependencies]
csv = "1"
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

# All integration tests live in a single binary so compile/link work (and
# llvm-cov instrumentation) is amortized across the whole suite instead of
# paid per-file. With every test file moved into `tests/it/`, no top-level
# `tests/*.rs` remain for Cargo to auto-discover — only this explicit target.
[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

# Opts this crate into `cargo verus verify`. Only code inside `verus!` is
# verified; the rest of the crate is compiled but not checked.
[package.metadata.verus]
verify = true
