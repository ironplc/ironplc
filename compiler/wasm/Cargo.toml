[package]
name = "ironplc-wasm"
description = "WebAssembly target for IronPLC: lowers the analysed program to its WebAssembly IR"
version = "0.247.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ironplc-analyzer = { path = "../analyzer", version = "0.247.0" }
ironplc-container = { path = "../container", version = "0.247.0" }
ironplc-dsl = { path = "../dsl", version = "0.247.0" }
ironplc-problems = { path = "../problems", version = "0.247.0" }
ironplc-wasm-codegen = { path = "../wasm-codegen", version = "0.247.0" }
ironplc-wasm-ir = { path = "../wasm-ir", version = "0.247.0" }
ironplc-wasm-symbols = { path = "../wasm-symbols", version = "0.247.0" }

[build-dependencies]
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

[dev-dependencies]
ironplc-codegen = { path = "../codegen", version = "0.247.0" }
ironplc-parser = { path = "../parser", version = "0.247.0" }
ironplc-project = { path = "../project", version = "0.247.0" }
ironplc-vm = { path = "../vm", version = "0.247.0", features = ["test-support"] }
ironplc-wasm-runner = { path = "../wasm-runner" }
spec_test_macro = { path = "../spec_test_macro" }

[lints]
workspace = true
