[package]
name = "ironplc-vm-cli"
description = "Command line interface for the IronPLC bytecode virtual machine"
version = "0.239.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ironplcvm"
path = "src/main.rs"

# The debug daemon: `ironplcvm` under a debugger. Named for the program rather
# than for the Debug Adapter Protocol it speaks, so the name outlasts the
# protocol; the DAP implementation lives in `src/dap/`.
#
# Built unconditionally, like every other shipped binary. `mod dap` is declared
# only in `dap_main.rs`, and separate `[[bin]]` targets are separate compilation
# units, so `ironplcvm` does not compile the DAP layer.
[[bin]]
name = "ironplcvmd"
path = "src/dap_main.rs"

[dependencies]
ironplc-vm = { path = "../vm", version = "0.239.0" }
ironplc-container = { path = "../container", version = "0.239.0" }
ironplc-cli-support = { path = "../cli-support", version = "0.239.0" }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
ctrlc = "3"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
csv = "1"
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

[dev-dependencies]
assert_cmd = { version = "2.2" }
ironplc-container = { path = "../container", version = "0.239.0" }
blake3 = "1"
predicates = { version = "3.1" }
tempfile = "3"
ctor = "1.0"
spec_test_macro = { path = "../spec_test_macro" }

[lints]
workspace = true
