[package]
name = "ironplc-vm-cli"
description = "Command line interface for the IronPLC bytecode virtual machine"
version = "0.238.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ironplcvm"
path = "src/main.rs"

# The Debug Adapter Protocol server. Built unconditionally, like every other
# shipped binary. It was once gated behind a `dap` feature to keep the DAP layer
# out of `ironplcvm`, but that gate bought nothing: `mod dap` is declared only in
# `dap_main.rs`, and separate `[[bin]]` targets are separate compilation units,
# so `ironplcvm` never compiled the DAP layer either way. What the gate did do
# was make `cargo build` skip this binary, leaving whatever stale copy was last
# built by hand in `target/` for editors to launch.
[[bin]]
name = "ironplcdap"
path = "src/dap_main.rs"

[dependencies]
ironplc-vm = { path = "../vm", version = "0.238.0" }
ironplc-container = { path = "../container", version = "0.238.0" }
ironplc-cli-support = { path = "../cli-support", version = "0.238.0" }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
ctrlc = "3"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
csv = "1"
ironplc-spec-requirements-gen = { path = "../spec_requirements_gen" }

[dev-dependencies]
assert_cmd = { version = "2.2" }
# `test-support` gives the tests the shared container fixtures. Enabling it
# here (dev-dependencies only) keeps it out of the `ironplcvm` binary.
ironplc-container = { path = "../container", version = "0.238.0", features = [
  "test-support",
] }
blake3 = "1"
predicates = { version = "3.1" }
tempfile = "3"
ctor = "1.0"
spec_test_macro = { path = "../spec_test_macro" }

[lints]
workspace = true
